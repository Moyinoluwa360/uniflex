name: uniflex
description: "Uniflex - campus food ordering, delivery, and errand app for Redeemer's University"
publish_to: 'none' # Private app, not published to pub.dev

# Read more about Android/iOS versioning at:
# https://developer.android.com/studio/publish/versioning
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management for the whole app (student, rider, admin all share this)
  flutter_riverpod: ^2.5.1

  # Loads runtime config (API keys, service URLs) from .env / .env.example
  flutter_dotenv: ^5.1.0

  # Brand typography (Inter) — used across the design system
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
