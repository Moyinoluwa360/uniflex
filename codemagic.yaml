workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.uniflex.uniflex
      groups:
        - env_file            # ENV_FILE_CONTENTS, CERTIFICATE_PRIVATE_KEY

    scripts:
      - name: Write .env file
        script: |
          echo "$ENV_FILE_CONTENTS" > $CM_BUILD_DIR/.env

      # Pack 2: .env is bundled INSIDE the app, so it may only hold public
      # values (Supabase URL + anon/publishable key, Paystack public key,
      # Firebase client config). Stop the build if a server secret slipped in.
      - name: Refuse server secrets in the bundled .env
        script: |
          if grep -Eiq '^(SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY|TERMII_API_KEY|PAYSTACK_SECRET_KEY|FIREBASE_SERVICE_ACCOUNT)|sb_secret_|sk_(live|test)_' "$CM_BUILD_DIR/.env"; then
            echo "ERROR: .env contains a server-side secret. Remove it from ENV_FILE_CONTENTS (Codemagic > env_file group) and rotate it."
            exit 1
          fi

      - name: Flutter pub get
        script: flutter pub get

      - name: Pod install
        script: |
          cd ios && pod install

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up code signing in Xcode
        script: xcode-project use-profiles

      - name: Flutter build iOS
        script: |
          # Use Codemagic's auto-incrementing build number so App Store
          # Connect never rejects a duplicate bundle version.
          flutter build ipa --release \
            --build-name=1.0.3 \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
